name: Semantic Architecture CI Enforcement

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-semantic-architecture:
    name: Semantic Architecture Guard & Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.27.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Base-Ref Scanner Integrity Verification
        run: |
          # Ensure scanner cannot be bypassed by PR changes to the scanner itself
          if git rev-parse --verify origin/master >/dev/null 2>&1; then
            BASE_REF="origin/master"
          elif git rev-parse --verify origin/main >/dev/null 2>&1; then
            BASE_REF="origin/main"
          else
            BASE_REF="HEAD"
          fi
          echo "Verifying scanner against base ref: $BASE_REF"
          mkdir -p .tmp-scanner
          git show "$BASE_REF:scripts/verify-semantic-architecture.ts" > .tmp-scanner/verify-semantic-architecture.ts 2>/dev/null || cp scripts/verify-semantic-architecture.ts .tmp-scanner/verify-semantic-architecture.ts
          npx tsx .tmp-scanner/verify-semantic-architecture.ts

      - name: Verify Architecture Invariants via AST Scanner
        run: npm run verify:architecture

      - name: Run Architecture Test Suites
        run: npm run test:architecture

